version: v2
clean: true
plugins:
  # プラグインは tools/go.mod で固定したものを go tool 経由で呼ぶ。
  - local: ["go", "tool", "-modfile=tools/go.mod", "protoc-gen-go"]
    out: gen
    opt: paths=source_relative
  - local: ["go", "tool", "-modfile=tools/go.mod", "protoc-gen-connect-go"]
    out: gen
    opt: paths=source_relative
